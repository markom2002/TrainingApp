name: Container smoke test

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        compose: ["compose.yaml", "compose.yaml:compose.demo.yaml"]
    env:
      COMPOSE_FILE: ${{ matrix.compose }}
    steps:
      - uses: actions/checkout@v4
      - name: Create ephemeral configuration
        shell: bash
        run: |
          echo "SQL_PASSWORD=Ci_$(openssl rand -hex 16)!" > .env
          echo "JWT_KEY=$(openssl rand -hex 32)" >> .env
      - name: Build and start the complete stack
        run: docker compose up --build -d
      - name: Wait for API through HTTPS proxy
        run: curl --fail --insecure --retry 40 --retry-all-errors --retry-delay 3 https://localhost:8443/health/live
      - name: Verify packaged frontend and authentication
        run: python3 scripts/Verify-Container.py
      - name: Container logs
        if: failure()
        run: docker compose logs --no-color
      - name: Stop disposable stack
        if: always()
        run: docker compose down --volumes
