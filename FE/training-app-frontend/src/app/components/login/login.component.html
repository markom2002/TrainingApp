<div class="login-wrapper">

  <div class="login-card">
    <div class="brand">
      <div class="logo">🏋️</div>
      <h2>TrainingApp</h2>
      <p class="subtitle">Track. Improve. Dominate.</p>
    </div>

    @if (registered) { <p role="status">Account created. Sign in to continue.</p> }
    <form (ngSubmit)="onLogin(loginForm)" #loginForm="ngForm">
      <div class="input-group">
        <input 
          type="text" 
          [(ngModel)]="username" 
          name="username" 
          maxlength="254" placeholder="Email" 
          required />
      </div>

      <div class="input-group">
        <input 
          type="password" 
          [(ngModel)]="password" 
          name="password" 
          placeholder="Password" 
          required />
      </div>

      @if (errorMessage) { <p role="alert">{{ errorMessage }}</p> }
      <button type="submit" class="login-btn" [disabled]="loginForm.invalid || submitting">
        Login
      </button>
    </form>

    <p class="register-text">
      Don’t have an account?
      <a routerLink="/register">Create one</a>
    </p>
  </div>

</div>
