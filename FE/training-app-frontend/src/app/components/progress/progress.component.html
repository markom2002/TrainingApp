<div class="progress-wrapper">

  <div class="progress-header">
    <h2>Monthly Progress</h2>
    <div class="header-line"></div>
  </div>

  <div class="filters-card">

    <div class="filter-group">
      <label>Year</label>
      <input type="number" [(ngModel)]="year">
    </div>

    <div class="filter-group">
      <label>Month</label>
      <input type="number" [(ngModel)]="month" min="1" max="12">
    </div>

    <button class="load-btn" (click)="loadStats()">
      Load Statistics 📊
    </button>

  </div>

  <div class="table-card" *ngIf="stats.length > 0">
    <table>
      <thead>
        <tr>
          <th>Week</th>
          <th>Total Duration</th>
          <th>Trainings</th>
          <th>Avg Intensity</th>
          <th>Avg Fatigue</th>
        </tr>
      </thead>

      <tbody>
        <tr *ngFor="let s of stats">
          <td class="week">Week {{ s.week }}</td>
          <td>{{ s.totalDuration }} min</td>
          <td>{{ s.count }}</td>

          <td>
            <span class="badge intensity">
              {{ s.avgIntensity }}
            </span>
          </td>

          <td>
            <span class="badge fatigue">
              {{ s.avgFatigue }}
            </span>
          </td>
        </tr>
      </tbody>
    </table>
  </div>

  <div class="empty-card" *ngIf="stats.length === 0">
    <div class="empty-icon">📈</div>
    <p>No data available for selected month.</p>
  </div>

</div>
