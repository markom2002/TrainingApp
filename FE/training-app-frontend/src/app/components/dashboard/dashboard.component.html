<div class="dashboard-container">

  <div class="top-bar">

    <div class="greeting">
      <h1 class="welcome-title">
        Welcome back, {{username}}
      </h1>
    </div>

    <div class="actions">
      <button class="add-btn" (click)="goToAddTraining()">+ Add Training</button>
      <button class="logout" (click)="logout()">Logout</button>
    </div>

  </div>

  <p>Account role: {{ authService.role }}</p>
  <div class="card" *ngIf="authService.role === 'Admin'">
    <h3>Administration</h3>
    <button class="add-btn" (click)="loadAdminSummary()">Load application statistics</button>
    <p *ngIf="adminSummary">Users: {{ adminSummary.userCount }} · Trainings: {{ adminSummary.trainingCount }}</p>
    <p role="alert" *ngIf="adminError">{{ adminError }}</p>
  </div>
  <div class="stats-banner">
    <div class="stat-box">
      ðŸ’ª Stay Strong
    </div>
    <div class="stat-box">
      ðŸ”¥ Burn Calories
    </div>
    <div class="stat-box">
      ðŸ“ˆ Track Progress
    </div>
  </div>

  <div class="card">
    <h3>My Trainings</h3>
    <app-training-list></app-training-list>
  </div>

  <div class="card">
    <h3>Monthly Progress</h3>
    <app-progress></app-progress>
  </div>

</div>
