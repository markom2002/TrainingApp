<div class="form-wrapper" *ngIf="formModel">
  <div class="form-card">

    <div class="form-header">
      <h2>Edit Workout</h2>
      <div class="header-line"></div>
    </div>

    <form (ngSubmit)="submit()">

      <div class="form-group">
        <label>Exercise Type</label>
        <select [(ngModel)]="formModel.exerciseType" name="exerciseType">
          <option [value]="exerciseTypes.Cardio">Cardio 🏃</option>
          <option [value]="exerciseTypes.Strength">Strength 💪</option>
          <option [value]="exerciseTypes.Flexibility">Flexibility 🧘</option>
        </select>
      </div>

      <div class="form-group">
        <label>Duration (minutes)</label>
        <input type="number" [(ngModel)]="formModel.durationMinutes" name="durationMinutes">
      </div>

      <div class="form-group">
        <label>Calories Burned 🔥</label>
        <input type="number" [(ngModel)]="formModel.calories" name="calories">
      </div>

      <div class="form-group">
        <label>Intensity (1-10)</label>
        <input type="number" [(ngModel)]="formModel.intensity" name="intensity">
      </div>

      <div class="form-group">
        <label>Fatigue Level (1-10)</label>
        <input type="number" [(ngModel)]="formModel.fatigue" name="fatigue">
      </div>

      <div class="form-group">
        <label>Training Date & Time</label>
        <input type="datetime-local" [(ngModel)]="formModel.trainingDate" name="trainingDate">
      </div>

      <div class="form-group">
        <label>Notes</label>
        <textarea [(ngModel)]="formModel.notes" name="notes" rows="3"></textarea>
      </div>

      <div class="button-group">
        <button type="submit" class="submit-btn">
          Save Changes
        </button>
        <button type="button" class="cancel-btn" (click)="cancel()">
          Cancel
        </button>
      </div>

    </form>

  </div>
</div>
