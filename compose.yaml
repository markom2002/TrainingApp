name: training-portfolio

x-app: &app
  image: training-journal:local
  build: .
  environment: &app-environment
    ASPNETCORE_ENVIRONMENT: Production
    ConnectionStrings__DefaultConnection: "Server=db;Database=TrainingPortfolio;User Id=sa;Password=${SQL_PASSWORD:?Set SQL_PASSWORD in .env};Encrypt=True;TrustServerCertificate=True"
    Jwt__Key: ${JWT_KEY:?Set JWT_KEY in .env}

services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${SQL_PASSWORD:?Set SQL_PASSWORD in .env}
    volumes:
      - sql-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", '/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$$MSSQL_SA_PASSWORD" -C -b -Q "SELECT 1" > /dev/null']
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    restart: unless-stopped

  migrate:
    <<: *app
    command: ["--migrate"]
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  app:
    <<: *app
    environment:
      <<: *app-environment
      # Only Caddy exposes a host port; the API is reachable on the internal network.
      ASPNETCORE_FORWARDEDHEADERS_ENABLED: "true"
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  web:
    image: caddy:2-alpine
    ports:
      - "127.0.0.1:8443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      app:
        condition: service_started
    restart: unless-stopped

volumes:
  sql-data:
  caddy-data:
  caddy-config:
